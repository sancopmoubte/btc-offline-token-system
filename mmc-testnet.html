<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫猫币 MMC · 独立测试网</title>
<style>
body{margin:0;background:#08111f;color:#e9f1ff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 16px 44px}h1{margin:8px 0;color:#62e6ff}.card{background:#101d31;border:1px solid #223653;border-radius:16px;padding:18px;margin:14px 0}.muted{color:#9bb0cd;font-size:13px}.value{font-size:30px;font-weight:800;color:#55e69a;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#9bb0cd;font-size:13px;margin:10px 0 5px}input{width:100%;box-sizing:border-box;background:#091526;color:#fff;border:1px solid #2c486a;border-radius:9px;padding:11px;font:inherit}button{width:100%;border:0;border-radius:9px;padding:12px;background:linear-gradient(135deg,#38bbd7,#3d7be8);color:#fff;font-weight:700;font-size:16px;margin-top:14px}.ok{color:#55e69a}.err{color:#ff7185;white-space:pre-wrap}.small{font-size:12px;word-break:break-all;color:#9bb0cd}
</style></head>
<body><div class="wrap">
<h1>猫猫币 MMC 独立测试网</h1><p class="muted">TESTNET · 与生产链完全隔离 · 转账 1 秒后可打包</p>
<div class="card"><div class="muted">测试地址余额</div><div id="balance" class="value">读取中…</div><div id="status" class="muted">正在连接测试网…</div></div>
<div class="card"><h2>测试转账</h2><div class="muted">此页面只用于测试，不使用生产链私钥验签；发送方固定为下方测试地址。</div><label>发送方</label><div id="from" class="small"></div><label>接收方完整地址</label><input id="to" placeholder="pqc1…"><div class="row"><div><label>金额 MMC</label><input id="amount" inputmode="decimal" value="1"></div><div><label>测试说明</label><input id="memo" value="1 秒打包测试"></div></div><button id="send">提交测试转账</button><div id="msg" class="muted"></div></div>
<div class="card muted">测试网区块高度：<b id="height">—</b><br>测试网创世哈希：<span class="small">9c0dab35c00d2ef54bf4fae26c88bd5558d8dfdc057f7640289bc4df748fffa6</span><br><br><b>注意：</b>测试余额和测试交易不会进入生产链，也不能兑换成生产 MMC。</div>
</div><script>
const URL='https://iohehvhbzmagvhlohloj.supabase.co';const KEY='sb_publishable_YwLdV_y3x-mqGWBOYSkW2g_dhlThVQ-';const FROM='pqc15e91a92ae40ac6acb449dcd8e079a84ddf2eb1ba';
const headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};const $=id=>document.getElementById(id);$('from').textContent=FROM;
async function rpc(name,body={}){const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||'测试网 RPC 失败');return j}
async function refresh(){try{const x=await rpc('get_mmc_testnet_status');$('balance').textContent=Number(x.test_balance||0).toLocaleString('en-US')+' MMC';$('height').textContent=x.height;$('status').textContent='待打包：'+x.pending_count+' 笔 · 服务器端测试网正常';}catch(e){$('status').textContent=e.message;$('status').className='err'}}
$('send').onclick=async()=>{const b=$('msg');$('send').disabled=true;b.className='muted';try{const to=$('to').value.trim(),amount=Number($('amount').value);if(!/^pqc1[A-Za-z0-9_-]+$/.test(to))throw Error('接收地址必须以 pqc1 开头');if(!Number.isFinite(amount)||amount<=0||Math.round(amount*1e8)!==amount*1e8)throw Error('金额必须大于 0，最多 8 位小数');await rpc('submit_mmc_testnet_transfer',{p_from:FROM,p_to:to,p_amount:amount});b.textContent='已进入测试网待打包池，等待 1 秒…';await new Promise(r=>setTimeout(r,1100));const mined=await rpc('mine_mmc_testnet_block');b.textContent=mined.status==='confirmed'?'测试转账已确认：测试网高度 '+mined.height:'测试转账仍在待打包池，请稍后刷新';b.className='ok';await refresh()}catch(e){b.textContent=e.message;b.className='err'}finally{$('send').disabled=false}};refresh();setInterval(refresh,1000);
</script></body></html>
